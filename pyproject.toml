[project]
name = "quant-system"
version = "0.1.0"
description = "A-share quantitative trading system: PIT-correct data, event-driven backtest, artifact lineage, paper trading."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "PyYAML>=6.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["quant_system"]
ignore_missing_imports = true
check_untyped_defs = true
